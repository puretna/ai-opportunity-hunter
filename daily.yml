name: Daily AI Opportunity Hunter

on:
  schedule:
    - cron: "0 5 * * *"   # Türkiye saatiyle yaklaşık 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: pip install -r requirements.txt

      - name: Hunter çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hunter.py

      - name: Raporu kaydet
        run: |
          git config user.name "ai-opportunity-bot"
          git config user.email "actions@github.com"
          git add reports/latest_report.md reports/domain_candidates.csv
          git commit -m "Daily opportunity report" || echo "No changes"
          git push
